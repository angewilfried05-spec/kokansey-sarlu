services:
  - type: web
    name: kokansey-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kokansey-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        value: https://kokansey-frontend.vercel.app
      - key: SERVE_FRONTEND
        value: false

databases:
  - name: kokansey-db
    plan: free
    databaseName: kokansey
