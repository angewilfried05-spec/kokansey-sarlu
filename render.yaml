# Render deployment configuration - Backend + Frontend
services:
  - type: web
    name: kokansey-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npx vite build
    startCommand: cd backend && npx prisma generate && npx prisma db push && npx prisma db seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kokansey-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        value: https://kokansey-backend.onrender.com
      - key: SERVE_FRONTEND
        value: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Administrateur
      - key: ENABLE_WHATSAPP
        value: false

databases:
  - name: kokansey-db
    plan: free
    databaseName: kokansey
