# Render deployment configuration - Backend + Frontend
services:
  - type: web
    name: kokansey-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npm run build
    startCommand: cd backend && npx prisma generate && npx prisma db push && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kokansey-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        value: https://kokansey-sarlu-1.onrender.com
      - key: SERVE_FRONTEND
        value: true

databases:
  - name: kokansey-db
    plan: free
    databaseName: kokansey
